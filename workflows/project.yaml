# Per-target account + rpcs.
# Agents owner is the Safe 0x73494691C9B28b91A0b4C9dF213c1893fddA3a3B
# (guardian Safe + executor), used by every agents target below.

# FeeSharesMinter
devnet-settings:
  # account:
  #   workflow-owner-address: ""
  rpcs:
    - chain-name: ethereum-mainnet
      url: ${RPC_TENDERLY_DEVNET}

production-settings:
  rpcs:
    - chain-name: ethereum-mainnet
      url: https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}

