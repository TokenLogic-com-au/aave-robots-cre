# ==========================================================================
# CRE PROJECT SETTINGS
# ==========================================================================
# Per-target account + rpcs. FeeSharesMinter targets (devnet/production) and the
# per-network automation-agents targets coexist here.
#
# Automation-agents owner: the "proxied guardian" Safe
# 0x73494691C9B28b91A0b4C9dF213c1893fddA3a3B (splits ownership between a guardian
# Safe and the executor). Same Safe owns every agents target.
# ==========================================================================

# ---- FeeSharesMinter ----
devnet-settings:
  # account:
  #   workflow-owner-address: ""
  rpcs:
    - chain-name: ethereum-mainnet
      url: ${RPC_TENDERLY_DEVNET}

production-settings:
  rpcs:
    - chain-name: ethereum-mainnet
      url: https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}

# ---- Automation agents (existing protocol robots via MailboxCRE) ----
ethereum-agents-production-settings:
  account:
    workflow-owner-address: "0x73494691C9B28b91A0b4C9dF213c1893fddA3a3B"
    workflow-name: "deployer"
  rpcs:
    - chain-name: ethereum-mainnet
      url: ${RPC_URL_ETHEREUM}

