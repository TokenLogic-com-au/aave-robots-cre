# CRE workflow settings — Governance storage-roots robot.
# Log-triggered (VotingActivated on Aave Governance V3, Ethereum). On each event
# it fetches the Ethereum block header + account/storage proofs via
# ConfidentialHTTPClient (eth_getBlockByHash / eth_getProof) and submits them to
# the DataWarehouse on the proposal's voting chain through MailboxCRE.
# Deploy/simulate per target, e.g.:
#   cre workflow simulate ./gov-storage-roots --target=gov-roots-production-settings

# ETH_RPC_URL secret is required (see ../secrets.yaml) for the proof fetches.
gov-roots-production-settings:
  user-workflow:
    workflow-name: "gov-storage-roots-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: "../secrets.yaml"

gov-roots-staging-settings:
  user-workflow:
    workflow-name: "gov-storage-roots-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: "../secrets.yaml"
