# CRE workflow settings - one target per network. The engine (main.ts) is shared;
# each target swaps the per-network config file that lists the robots to automate.
# Deploy/simulate per target, e.g.:
#   cre workflow simulate ./automation --target=ethereum-agents-production-settings

ethereum-agents-production-settings:
  user-workflow:
    workflow-name: "automation-ethereum-agents"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.ethereum-agents.json"
    secrets-path: ""

